<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mercado Curado Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #005792;
            --primary-container: #0070ba;
            --surface: #f7f9fb;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f0f2f5;
            --surface-container-high: #e6e8ea;
            --on-surface: #191c1e;
            --on-surface-variant: #40484c;
            --shadow-soft: 0 12px 32px -4px rgba(25, 28, 30, 0.06);
            --radius-xl: 0.75rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--surface); display: flex; min-height: 100vh; }

        /* SIDEBAR */
        .sidebar { width: 240px; background: white; border-right: 1px solid var(--surface-container-high); position: fixed; height: 100vh; padding: 24px 0; }
        .sidebar-logo { padding: 0 24px 32px; display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 32px; height: 32px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 24px; text-decoration: none; color: var(--on-surface-variant); font-weight: 500; font-size: 0.9rem; margin: 4px 12px; border-radius: 8px; }
        .nav-item.active { background: rgba(0, 87, 146, 0.05); color: var(--primary); font-weight: 600; }
        .nav-item:hover:not(.active) { background: var(--surface-container-low); }

        /* MAIN */
        .main-content { flex: 1; margin-left: 240px; }
        .top-bar { height: 72px; background: white; border-bottom: 1px solid var(--surface-container-high); padding: 0 40px; display: flex; align-items: center; justify-content: space-between; }
        .view-body { padding: 40px; max-width: 1200px; margin: 0 auto; }

        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 32px; }
        .card { background: white; padding: 24px; border-radius: var(--radius-xl); box-shadow: var(--shadow-soft); }
        .card h3 { font-family: 'Manrope'; font-size: 0.75rem; color: var(--on-surface-variant); text-transform: uppercase; margin-bottom: 12px; }
        .card p { font-size: 1.75rem; font-weight: 800; color: var(--primary); }

        .btn-logout { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fas fa-shopping-bag"></i></div>
            <div style="font-weight: 800; letter-spacing: -0.02em;">Mis Compras</div>
        </div>
        <nav>
            <a href="index.html" class="nav-item active"><i class="fas fa-th-large"></i> Tablero</a>
            <a href="productos.html" class="nav-item"><i class="fas fa-box"></i> Productos</a>
            <a href="ventas.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Pedidos</a>
            <a href="usuarios.html" class="nav-item"><i class="fas fa-users"></i> Usuarios</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <div style="font-weight: 700; font-size: 1.1rem;">Bienvenido de nuevo, Administrador</div>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </header>

        <div class="view-body">
            <h1>Resumen del Sistema</h1>
            <div class="cards">
                <div class="card"><h3>Usuarios</h3><p id="totalUsuarios">0</p></div>
                <div class="card"><h3>Productos</h3><p id="totalProductos">0</p></div>
                <div class="card"><h3>Ventas</h3><p id="totalVentas">0</p></div>
                <div class="card"><h3>Ingresos</h3><p id="totalIngresos">$0</p></div>
            </div>
        </div>
    </main>

    <script>
        if (localStorage.getItem("rol") !== "admin") window.location.href = "../index.html";
        function logout() { localStorage.clear(); window.location.href = "../index.html"; }

        // Mocks for now
        document.getElementById("totalUsuarios").innerText = "12";
        document.getElementById("totalProductos").innerText = "45";
        document.getElementById("totalVentas").innerText = "8";
        document.getElementById("totalIngresos").innerText = "$1,200,000";
    </script>
</body>
</html>
