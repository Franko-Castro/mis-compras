<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos - MisCompras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../estilos.css">
    
    <style>
        :root {
            --primary: #005792;
            --primary-container: #0070ba;
            --surface: #f7f9fb;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f0f2f5;
            --shadow-soft: 0 12px 32px -4px rgba(25, 28, 30, 0.06);
            --radius-xl: 0.75rem;
        }

        body {
            background-color: var(--surface);
            font-family: 'Inter', sans-serif;
            color: #191c1e;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .headline-lg {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .pedidos-lista {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .pedido-card {
            background: var(--surface-container-lowest);
            padding: 24px;
            border-radius: var(--radius-xl);
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 24px;
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s;
        }

        .pedido-card:hover {
            transform: translateX(8px);
        }

        .pedido-info h4 { font-size: 1.1rem; margin-bottom: 4px; }
        .pedido-info p { font-family: 'Manrope'; font-size: 0.85rem; color: #666; }

        .pedido-precio { font-weight: 800; color: var(--primary); font-size: 1.25rem; }

        .status-badge {
            padding: 6px 12px;
            border-radius: 9999px;
            font-family: 'Manrope';
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pendiente { background: #fff7ed; color: #9a3412; }
        .status-completado { background: #f0fdf4; color: #166534; }
        .status-cancelado { background: #fef2f2; color: #991b1b; }

        .btn-back {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .dropdown-content.show {
            display: block !important;
        }

        .dropdown-content a:hover {
            background-color: var(--surface-container-low);
        }
    </style>
</head>
<body>

<nav>
  <a href="../../index.html">Inicio</a>
  <a href="ventas.html">Gestión de Pedidos</a>
</nav>

<div class="container">
    <a href="../../perfil.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver al Perfil</a>
    
    <div class="header">
        <h1 class="headline-lg">Gestión de Pedidos</h1>
        <div id="contador" style="font-family: 'Manrope'; font-weight: 700; color: #666;">0 PEDIDOS</div>
    </div>

    <div id="ventas" class="pedidos-lista">
        <!-- Contenido dinámico -->
    </div>
</div>

<script>
    async function cargarVentas() {
        const id = localStorage.getItem("id_usuario");
        const resp = await fetch(`../../php/vendedor_obtener_ventas.php?id_vendedor=${id}`);
        const data = await resp.json();
        const cont = document.getElementById("ventas");
        
        if(!data.ventas || data.ventas.length === 0) {
            cont.innerHTML = "<p style='text-align:center; padding:40px; opacity:0.5;'>No hay pedidos registrados.</p>";
            return;
        }

        document.getElementById("contador").textContent = `${data.ventas.length} PEDIDOS`;

        let html = '';
        data.ventas.forEach(v => {
            const statusClass = `status-${v.estado.toLowerCase()}`;
            html += `
                <div class="pedido-card">
                    <div style="width:50px; height:50px; background:var(--surface-container-low); border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--primary);">
                        <i class="fas fa-shopping-bag fa-lg"></i>
                    </div>
                    <div class="pedido-info">
                        <h4>${v.producto}</h4>
                        <p>ID Venta: #${v.id_venta} • ${v.fecha} • Cant: ${v.cantidad}</p>
                    </div>
                    <div class="pedido-precio">$${v.total}</div>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span class="status-badge ${statusClass}">${v.estado}</span>
                        <select onchange="cambiarEstado(${v.id_venta}, this.value)" style="border:none; background:var(--surface-container-low); padding:5px; border-radius:5px; font-family:'Manrope'; font-size:0.7rem;">
                            <option value="Pendiente" ${v.estado==='Pendiente'?'selected':''}>Pendiente</option>
                            <option value="Completado" ${v.estado==='Completado'?'selected':''}>Completado</option>
                            <option value="Cancelado" ${v.estado==='Cancelado'?'selected':''}>Cancelado</option>
                        </select>
                        
                        <div style="position:relative;" class="dropdown">
                            <button onclick="this.nextElementSibling.classList.toggle('show')" style="border:none; background:none; cursor:pointer; padding:5px; color:#666;">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                            <div class="dropdown-content" style="display:none; position:absolute; right:0; background:white; box-shadow:var(--shadow-soft); border-radius:8px; z-index:10; min-width:160px; padding:8px;">
                                <a href="javascript:void(0)" onclick="contactarWhatsApp('${encodeURIComponent(JSON.stringify(v))}')" style="display:flex; align-items:center; gap:10px; padding:8px; text-decoration:none; color:#25D366; font-size:0.85rem; font-weight:600;">
                                    <i class="fab fa-whatsapp"></i> Contactar Cliente
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        cont.innerHTML = html;
    }

    function contactarWhatsApp(vJson) {
        const v = JSON.parse(decodeURIComponent(vJson));
        let tel = v.comprador_whatsapp ? v.comprador_whatsapp.replace(/\D/g, '') : '';
        
        if(!tel) {
            tel = prompt(`El cliente ${v.comprador_nombre} no tiene un número registrado. \nPor favor, ingresa el número de WhatsApp manualmente (solo números):`);
            if(!tel) return; // Cancelado
            tel = tel.replace(/\D/g, '');
        }

        const mensaje = `Hola ${v.comprador_nombre}, te contacto desde MisCompras por tu pedido:\n\n` +
                        `📦 *Producto:* ${v.producto}\n` +
                        `🔢 *Cantidad:* ${v.cantidad}\n` +
                        `💰 *Total:* $${v.total}\n` +
                        `📍 *Dirección:* ${v.comprador_direccion || 'No especificada'}\n` +
                        `🆔 *Venta:* #${v.id_venta}\n\n` +
                        `¿Cómo podemos ayudarte con tu entrega?`;

        const url = `https://wa.me/${tel}?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    }

    // Cerrar dropdowns al hacer clic fuera
    window.onclick = function(event) {
        if (!event.target.matches('.fa-ellipsis-v') && !event.target.matches('button')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }

    async function cambiarEstado(id, nuevo) {
        const fd = new FormData();
        fd.append('id_venta', id);
        fd.append('estado', nuevo);
        await fetch('../../php/actualizar_estado_venta.php', { method: 'POST', body: fd });
        cargarVentas();
    }

    document.addEventListener("DOMContentLoaded", cargarVentas);
</script>

</body>
</html>
