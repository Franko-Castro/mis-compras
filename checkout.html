<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Finalizar Pago</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .checkout-container {
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      width: 400px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      color: #28a745;
      margin: 10px 0 20px;
    }

    .info {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    .nequi-box {
      background: #f1f3f5;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    input[type="file"] {
      margin: 15px 0;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    button:hover {
      background: #0056b3;
    }

    .success {
      color: #28a745;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="checkout-container">

  <h2>💳 Finalizar Pago</h2>

  <div class="total" id="total">$0</div>

  <p class="info">
    Realiza el pago por Nequi y sube el comprobante
  </p>

  <div class="nequi-box">
    📱 Número Nequi:<br>
    <strong>300 123 4567</strong>
  </div>

  <input type="file" id="comprobante" accept="image/*">

  <button onclick="enviarComprobante()">Enviar comprobante</button>

  <p id="mensaje" class="success"></p>

</div>

<script>
function getOrderId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("order_id");
}

// 🔥 OPCIONAL: traer total desde localStorage o URL
document.getElementById("total").textContent = "$" + Number(localStorage.getItem("total") || "0").toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

async function enviarComprobante() {
  const archivo = document.getElementById("comprobante").files[0];
  const order_id = getOrderId();

  if (!archivo) {
    alert("Sube el comprobante");
    return;
  }

  const formData = new FormData();
  formData.append("comprobante", archivo);
  formData.append("id_venta", order_id);

  const res = await fetch("php/subir_comprobante.php", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if (data.exito) {
    document.getElementById("mensaje").textContent = "✅ Comprobante enviado correctamente";
  } else {
    alert("❌ Error al subir comprobante");
  }
}
</script>

</body>
</html>
