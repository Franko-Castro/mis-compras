<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Detalle Premium | MisCompras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ========== MODERN BENTO STYLE ========== */
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(rgba(240, 244, 248, 0.4), rgba(240, 244, 248, 0.4)), url('imagenes/fondo\ 2.jpg');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      margin: 0;
      padding: 0;
      color: #1e293b;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    /* BENTO GRID */
    .bento-grid {
      display: grid;
      grid-template-columns: 100px 1.5fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 20px;
      grid-template-areas:
        "thumbs main title"
        "thumbs main seller"
        "thumbs main actions";
    }

    .bento-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 25px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* ÁREAS ESPECÍFICAS */
    .area-thumbs {
      grid-area: thumbs;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: transparent;
      border: none;
      backdrop-filter: none;
      box-shadow: none;
      padding: 0;
    }

    .area-main {
      grid-area: main;
      padding: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.0);
      border: none;
    }

    .area-title {
      grid-area: title;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .area-seller {
      grid-area: seller;
    }

    .area-actions {
      grid-area: actions;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* COMPONENTES INTERNOS */
    .thumb {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid transparent;
      cursor: pointer;
      overflow: hidden;
      transition: 0.2s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb.active {
      border-color: #3b82f6;
      transform: translateX(5px);
    }

    .main-img-box {
      width: 100%;
      height: 100%;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.3s ease;
    }

    .product-name {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 10px;
      color: #0f172a;
    }

    .product-price {
      font-size: 2.4rem;
      font-weight: 800;
      color: #2563eb;
    }

    .seller-info {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      color: inherit;
    }

    .seller-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #e2e8f0;
      object-fit: cover;
      border: 2px solid white;
    }

    .seller-details strong {
      display: block;
      font-size: 1.1rem;
      color: #0f172a;
    }

    .seller-details span {
      font-size: 0.85rem;
      color: #64748b;
    }

    .btn-bento {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }

    .btn-orange {
      background: #f97316;
      color: white;
      box-shadow: 0 10px 20px rgba(249, 115, 22, 0.3);
    }

    .btn-white {
      background: white;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }

    .btn-orange:hover {
      transform: translateY(-3px);
      background: #ea580c;
    }

    .btn-white:hover {
      background: #f8fafc;
    }

    /* DESCRIPCIÓN Y RESEÑAS (STACKED BELOW) */
    .bottom-section {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    .desc-card h3 {
      font-size: 1.3rem;
      margin-bottom: 15px;
    }

    .desc-text {
      line-height: 1.7;
      color: #475569;
      font-size: 1.05rem;
    }

    .reviews-card {
      max-height: 600px;
      overflow-y: auto;
    }

    .resena-item {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 15px;
      border: 1px solid #f1f5f9;
    }

    @media (max-width: 900px) {
      .bento-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "main"
          "thumbs"
          "title"
          "seller"
          "actions";
      }

      .area-thumbs {
        flex-direction: row;
        overflow-x: auto;
      }

      .thumb {
        width: 80px;
      }

      .bottom-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div id="contenedor-navegacion"></div>

  <div class="container">
    <div id="render-bento" class="bento-grid">
      <!-- Cargando -->
      <div style="grid-column: span 3; text-align: center; padding: 100px;">
        <i class="fas fa-circle-notch fa-spin" style="font-size: 2rem; color: #3b82f6;"></i>
      </div>
    </div>

    <div class="bottom-section">
      <div class="bento-card desc-card">
        <h3>Acerca de este producto</h3>
        <div id="product-desc" class="desc-text">Cargando descripción...</div>
      </div>

      <div class="bento-card reviews-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin:0">Opiniones</h3>
          <div id="avg-rating" style="color: #f59e0b; font-weight: 700;">⭐ 0.0</div>
        </div>
        <div id="list-reviews">Cargando opiniones...</div>

        <form id="form-review" style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
          <h4 style="margin-bottom: 15px;">Deja tu reseña</h4>
          <select name="calificacion" required
            style="width: 100%; padding: 10px; border-radius: 8px; margin-bottom: 10px;">
            <option value="">Calificación...</option>
            <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
            <option value="4">⭐⭐⭐⭐ Muy bueno</option>
            <option value="3">⭐⭐⭐ Bueno</option>
            <option value="2">⭐⭐ Regular</option>
            <option value="1">⭐ Malo</option>
          </select>
          <textarea name="comentario" placeholder="¿Qué te pareció?" required
            style="width: 100%; padding: 10px; border-radius: 8px; min-height: 80px; margin-bottom: 15px;"></textarea>
          <button type="submit" class="btn-bento btn-orange" style="padding: 12px;">Publicar</button>
        </form>
      </div>
    </div>
  </div>

  <div id="contenedor-pie"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get("id");

    async function init() {
      if (!productId) return;
      try {
        const resp = await fetch(`php/producto.php?id=${productId}`);
        const data = await resp.json();

        if (!data.exito) {
          document.getElementById("render-bento").innerHTML = "<h2>No encontrado</h2>";
          return;
        }

        const p = data.producto;

        // Llenar Bento
        const imgs = [p.imagen_url, ...(p.imagenes_extra || [])];
        let thumbsHTML = "";
        imgs.forEach((url, i) => {
          thumbsHTML += `
                        <div class="thumb ${i === 0 ? 'active' : ''}" onclick="swPhoto(this, '${url}')">
                            <img src="${url}" onerror="this.src='imagenes/default-product.svg'">
                        </div>
                    `;
        });

        document.getElementById("render-bento").innerHTML = `
                    <div class="area-thumbs">
                        ${thumbsHTML}
                    </div>
                    
                    <div class="bento-card area-main">
                        <div class="main-img-box">
                            <img id="primary-img" src="${p.imagen_url}" onerror="this.src='imagenes/default-product.svg'">
                        </div>
                    </div>

                    <div class="bento-card area-title">
                        <h1 class="product-name">${p.nombre}</h1>
                        <div class="product-price">${parseFloat(p.precio).toLocaleString('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 })}</div>
                    </div>

                    <div class="bento-card area-seller">
                        <a href="vendedor.html?id=${p.id_vendedor}" class="seller-info">
                            <img src="fotos_perfil/${p.foto_perfil || 'default_avatar.png'}" class="seller-avatar" onerror="this.src='fotos_perfil/default_avatar.png'">
                            <div class="seller-details">
                                <span style="color: ${parseInt(p.verificado) === 1 ? '#0061ff' : '#64748b'}; font-weight: 700; display: flex; align-items: center; gap: 4px;">
                                    <i class="fas ${parseInt(p.verificado) === 1 ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                                    ${parseInt(p.verificado) === 1 ? 'Vendedor Verificado' : 'Vendedor no verificado'}
                                </span>
                                <strong>${p.vendedor}</strong>
                            </div>
                        </a>
                    </div>

                    <div class="bento-card area-actions">
                        ${parseInt(p.verificado) === 1 ? `
                            <button class="btn-bento btn-orange agregar-carrito" 
                                    data-id="${p.id_producto}" 
                                    data-nombre="${p.nombre}" 
                                    data-precio="${p.precio}" 
                                    data-imagen="${p.imagen_url}">
                                <i class="fas fa-shopping-cart"></i> Agregar al carrito
                            </button>
                            <button class="btn-bento btn-white">Comprar ahora</button>
                        ` : `
                            <a href="https://wa.me/${p.whatsapp ? p.whatsapp.replace(/\D/g, '') : ''}?text=${encodeURIComponent('Hola, me interesa el producto: ' + p.nombre)}" 
                               target="_blank"
                               class="btn-bento btn-orange" 
                               style="text-decoration: none; background: #25d366;">
                                <i class="fab fa-whatsapp"></i> Contactar por WhatsApp
                            </a>
                            <p style="font-size: 0.85rem; color: #64748b; text-align: center; margin-top: 5px;">
                                <i class="fas fa-info-circle"></i> Este vendedor no está verificado. Compra directamente vía WhatsApp.
                            </p>
                        `}
                        <div style="font-size: 0.8rem; color: #64748b; text-align: center;">
                            <i class="fas fa-shield-alt"></i> Compra Protegida por MisCompras
                        </div>
                    </div>
                `;

        document.getElementById("product-desc").innerHTML = p.descripcion.replace(/\n/g, '<br>');

        loadStatus();
        loadReviews();

      } catch (e) { console.error(e); }
    }

    function swPhoto(el, url) {
      const main = document.getElementById("primary-img");
      main.style.opacity = "0";
      setTimeout(() => {
        main.src = url;
        main.style.opacity = "1";
      }, 200);
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    async function loadStatus() {
      const resp = await fetch(`php/promedio_calificacion.php?id=${productId}`);
      const d = await resp.json();
      document.getElementById("avg-rating").innerText = `⭐ ${d.promedio} / 5 (${d.total})`;
    }

    async function loadReviews() {
      const resp = await fetch(`php/obtener_resenas.php?id=${productId}`);
      const data = await resp.json();
      const cont = document.getElementById("list-reviews");
      cont.innerHTML = "";
      if (!data.resenas || data.resenas.length === 0) {
        cont.innerHTML = "<p>Sin opiniones todavía.</p>"; return;
      }
      data.resenas.forEach(r => {
        cont.innerHTML += `
                    <div class="resena-item">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <strong>${r.nombre}</strong>
                            <span style="color:#f59e0b;">⭐ ${r.calificacion}</span>
                        </div>
                        <p style="margin:0; font-size:0.9rem; color:#475569;">${r.comentario}</p>
                    </div>
                `;
      });
    }

    document.getElementById("form-review").addEventListener("submit", async (e) => {
      e.preventDefault();
      const uid = localStorage.getItem("id_usuario");
      if (!uid) return alert("Inicia sesión primero");
      const fd = new FormData(e.target);
      const payload = { id_producto: productId, id_usuario: uid, calificacion: fd.get("calificacion"), comentario: fd.get("comentario") };
      const resp = await fetch("php/guardar_resena.php", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const res = await resp.json();
      if (res.exito) { alert("¡Publicada!"); e.target.reset(); loadStatus(); loadReviews(); }
    });

    document.addEventListener("DOMContentLoaded", init);
  </script>
  <script src="carrito.js"></script>
  <script src="cargar-componentes.js"></script>
</body>

</html>
