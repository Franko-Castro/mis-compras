<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Producto | MisCompras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="cargar-componentes.js"></script>

  <style>
    html, body {
      height: 100%;
    }

    body {
      font-family: Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), url('imagenes/frutas_para_fondo.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .page-container {
      max-width: 860px;
      margin: 40px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.1);
    }

    .page-container h1 {
      font-size: 1.8rem;
      color: #0f172a;
      margin: 0 0 25px;
      text-align: left;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 15px;
    }

    #form-editar {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-section {
      display: grid;
      grid-template-columns: 1fr 250px;
      gap: 30px;
    }

    .inputs-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 8px;
    }

    #form-editar input,
    #form-editar textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      background: #fbfdff;
      font-size: 1rem;
      color: #0f172a;
      transition: all 0.2s;
    }

    #form-editar input:focus,
    #form-editar textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background: #ffffff;
    }

    #form-editar textarea {
      min-height: 150px;
      resize: vertical;
    }

    /* PREVIEW IMAGEN */
    .image-edit-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .preview-box {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
    }

    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .file-input-wrapper {
      position: relative;
      width: 100%;
    }

    .btn-file {
      display: block;
      width: 100%;
      padding: 10px;
      background: #f1f5f9;
      color: #475569;
      border-radius: 8px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      transition: all 0.2s;
    }

    .btn-file:hover {
      background: #e2e8f0;
    }

    .btn-file input {
      display: none;
    }

    /* BOTONES */
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
    }

    .btn {
      padding: 12px 25px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-save {
      background: #007bff;
      color: white;
    }

    .btn-save:hover {
      background: #0056d6;
      transform: translateY(-1px);
    }

    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-cancel:hover {
      background: #e2e8f0;
    }

    @media (max-width: 768px) {
      .form-section {
        grid-template-columns: 1fr;
      }
      .image-edit-section {
        order: -1;
      }
      .preview-box {
        max-width: 250px;
      }
      .page-container {
        margin: 20px 15px;
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <div id="contenedor-navegacion"></div>

  <div class="page-container">
    <h1><i class="fas fa-edit"></i> Editar mi Producto</h1>

    <form id="form-editar" enctype="multipart/form-data">
      <input type="hidden" name="id_producto" id="id_producto">

      <div class="form-section">
        <div class="inputs-column">
          <div class="form-group">
            <label>Nombre del producto</label>
            <input type="text" name="nombre" id="nombre" placeholder="Nombre del producto" required>
          </div>

          <div class="form-group">
            <label>Precio (COP)</label>
            <input type="number" name="precio" id="precio" step="1" min="0" placeholder="Ej: 150000" required>
          </div>

          <div class="form-group">
            <label>Descripción</label>
            <textarea name="descripcion" id="descripcion" placeholder="Explica detalladamente tu producto..." required></textarea>
          </div>
        </div>

        <div class="image-edit-section">
          <label>Imagen actual</label>
          <div class="preview-box">
            <img id="preview" src="imagenes/default-product.svg" alt="Vista previa">
          </div>
          <div class="file-input-wrapper">
            <label class="btn-file">
              <i class="fas fa-camera"></i> Cambiar imagen
              <input type="file" name="imagen" id="imagen" accept="image/*">
            </label>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <a href="perfil.html" class="btn btn-cancel">Cancelar</a>
        <button type="submit" class="btn btn-save">
          <i class="fas fa-check"></i> Guardar Cambios
        </button>
      </div>
    </form>
  </div>

  <div id="contenedor-pie"></div>

  <script src="editar_producto.js"></script>
</body>
</html>
