<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphones - MisCompras</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="contenedor-navegacion"></div>
    
    <main class="contenido-principal">
        <div class="contenedor-ancho">
            <section class="seccion-bienvenida">
                <h1>Smartphones</h1>
                <p>La última tecnología móvil a tu alcance</p>
                <div class="botones-principales">
                    <a href="index.html" class="boton boton-azul">Volver al Inicio</a>
                </div>
            </section>

            <section class="seccion-productos">
                <h2>Catálogo de Smartphones</h2>
                <div class="grilla-productos">
                    
                    <div class="tarjeta-producto">
                        <img src="imagendes de productos/ipone15.jpg" alt="iPhone 15">
                        <h3>iPhone 15 Pro</h3>
                        <p class="precio-destacado">$999</p>
                        <a href="producto1.html" class="boton-pequeno">Ver más</a>
                    </div>

                    <div class="tarjeta-producto">
                        <img src="imagendes de productos/image4.jpg" alt="iPad">
                        <h3>iPad Air</h3>
                        <p class="precio-destacado">$1,000</p>
                        <a href="producto4.html" class="boton-pequeno">Ver más</a>
                    </div>

                </div>
            </section>
        </div>
    </main>

    <div id="contenedor-pie"></div>
    <script src="cargar-componentes.js"></script>
</body>

</html>
