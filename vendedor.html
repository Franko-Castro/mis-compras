<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil del Vendedor - MisCompras</title>
  <meta name="description" content="Conoce al vendedor, sus productos y su información de contacto en MisCompras.">
  <link rel="stylesheet" href="estilos.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background:
        linear-gradient(rgba(248, 250, 252, 0.4), rgba(248, 250, 252, 0.4)),
        url('imagenes/fondo 2.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      color: #1e293b;
    }

    /* ===== HEADER / PORTADA ===== */
    .vendor-header {
      position: relative;
      width: 100%;
      height: 260px;
      overflow: hidden;
      background: linear-gradient(135deg, #1f3147, #2c4a6e);
    }

    .vendor-header .portada-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.7;
    }

    .vendor-header .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(15, 23, 42, 0.7));
    }

    /* Solo lectura badge */
    .readonly-badge {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== INTRO / AVATAR ===== */
    .vendor-intro {
      max-width: 1000px;
      margin: -60px auto 0;
      padding: 0 30px;
      position: relative;
      z-index: 10;
      display: flex;
      align-items: flex-end;
      gap: 20px;
    }

    .vendor-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 5px solid white;
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      background: #e2e8f0;
      flex-shrink: 0;
    }

    .vendor-name-block {
      padding-bottom: 12px;
    }

    .vendor-name-block h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: white;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .verification-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      background: #3b82f6;
      color: white;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
    }

    .verification-badge.unverified {
      background: #64748b;
      box-shadow: none;
      opacity: 0.8;
    }

    .vendor-name-block .join-date {
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* ===== LAYOUT PRINCIPAL ===== */
    .vendor-layout {
      max-width: 1000px;
      margin: 30px auto 60px;
      padding: 0 30px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .vendor-layout {
        grid-template-columns: 1fr;
      }

      .vendor-intro {
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-top: -50px;
      }

      .vendor-name-block h1 {
        color: #1e293b;
        text-shadow: none;
      }

      .vendor-name-block .join-date {
        color: #64748b;
      }
    }

    /* ===== PANEL LATERAL ===== */
    .panel-card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .panel-card h3 {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f8fafc;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-row .icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3498db;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .info-row .text label {
      display: block;
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-row .text span {
      font-size: 0.88rem;
      color: #1e293b;
      font-weight: 500;
    }

    /* Estrellas de rating */
    .rating-stars {
      color: #f59e0b;
      font-size: 1rem;
    }

    .rating-count {
      font-size: 0.8rem;
      color: #64748b;
      margin-left: 4px;
    }

    /* Botón WhatsApp */
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px;
      background: #25d366;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      margin-top: 5px;
    }

    .btn-whatsapp:hover {
      background: #1da851;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
    }

    /* ===== SECCIÓN DE PRODUCTOS ===== */
    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title .count-badge {
      background: #3498db;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
    }

    .vendor-products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 16px;
    }

    .vendor-product-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .vendor-product-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      border-color: #3498db;
    }

    .vendor-product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #f8fafc;
    }

    .vendor-product-card .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .vendor-product-card h4 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .vendor-product-card .price {
      font-size: 1rem;
      font-weight: 800;
      color: #e74c3c;
      margin-bottom: 12px;
    }

    .vendor-product-card .btn-ver {
      margin-top: auto;
      display: block;
      text-align: center;
      background: #3498db;
      color: white;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .vendor-product-card .btn-ver:hover { background: #2980b9; }

    /* Estado vacío */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
      grid-column: 1 / -1;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 15px;
      opacity: 0.4;
      display: block;
    }

    .empty-state p {
      font-size: 1rem;
    }

    /* Skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, #f0f4f8 25%, #e2e8f0 50%, #f0f4f8 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .skeleton-card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .skeleton-img {
      height: 150px;
      width: 100%;
      border-radius: 0;
    }

    .skeleton-line {
      height: 14px;
      margin: 14px 14px 8px;
    }

    .skeleton-line.short {
      width: 50%;
      height: 12px;
      margin-top: 0;
    }
  </style>
</head>

<body>
  <div id="contenedor-navegacion"></div>

  <!-- PORTADA -->
  <div class="vendor-header" id="vendor-header">
    <img class="portada-img" id="vendor-portada" src="imagenes/default-cover.jpg" alt="Portada del vendedor"
      onerror="this.style.display='none'">
    <div class="overlay"></div>
    <div class="readonly-badge">
      <i class="fas fa-eye"></i> Solo lectura
    </div>
  </div>

  <!-- INTRO: avatar + nombre -->
  <div class="vendor-intro">
    <img class="vendor-avatar" id="vendor-avatar" src="imagenes/default-avatar.svg" alt="Avatar del vendedor"
      onerror="this.src='imagenes/default-avatar.svg'">
    <div class="vendor-name-block">
      <h1 id="vendor-nombre">Cargando...</h1>
      <p class="join-date" id="vendor-fecha"><i class="fas fa-calendar-alt"></i> Miembro desde ...</p>
    </div>
  </div>

  <!-- LAYOUT: lateral + productos -->
  <div class="vendor-layout">

    <!-- COLUMNA LATERAL -->
    <aside>
      <!-- Información personal -->
      <div class="panel-card">
        <h3><i class="fas fa-user-circle"></i> Información del vendedor</h3>

        <div class="info-row">
          <div class="icon"><i class="fas fa-map-marker-alt"></i></div>
          <div class="text">
            <label>Ubicación</label>
            <span id="vendor-ubicacion">—</span>
          </div>
        </div>

        <!-- Mini mapa (se inyecta si hay ubicación) -->
        <div id="vendor-mapa-container" style="display:none; margin-top: 12px;">
          <div style="border-radius: 12px; overflow: hidden; height: 160px; border: 1px solid #e2e8f0;">
            <iframe id="vendor-mapa" width="100%" height="100%" frameborder="0" style="border:0" allowfullscreen
              loading="lazy">
            </iframe>
          </div>
          <a id="vendor-mapa-link" href="#" target="_blank"
            style="margin-top: 10px; display: inline-flex; width: 100%; justify-content: center; align-items: center; gap: 6px; color: #3498db; text-decoration: none; font-size: 0.85rem; font-weight: 600; padding: 8px; background: #eff6ff; border-radius: 8px; transition: background 0.2s;">
            <i class="fas fa-map-marker-alt"></i> Ver en Mapa Completo
          </a>
        </div>

        <div class="info-row">
          <div class="icon"><i class="fas fa-envelope"></i></div>
          <div class="text">
            <label>Correo electrónico</label>
            <span id="vendor-email">—</span>
          </div>
        </div>

        <div class="info-row">
          <div class="icon"><i class="fas fa-star"></i></div>
          <div class="text">
            <label>Calificación</label>
            <span>
              <span class="rating-stars" id="vendor-stars">—</span>
              <span class="rating-count" id="vendor-rating-count"></span>
            </span>
          </div>
        </div>

        <div class="info-row">
          <div class="icon"><i class="fas fa-box"></i></div>
          <div class="text">
            <label>Productos publicados</label>
            <span id="vendor-total-productos">—</span>
          </div>
        </div>
      </div>

      <!-- Contacto (WhatsApp) -->
      <div class="panel-card" id="panel-contacto" style="display:none;">
        <h3><i class="fas fa-phone"></i> Contactar</h3>
        <a class="btn-whatsapp" id="btn-whatsapp" href="#" target="_blank">
          <i class="fab fa-whatsapp"></i> Escribir por WhatsApp
        </a>
      </div>

      <!-- Políticas del vendedor -->
      <div class="panel-card" id="panel-politicas" style="display:none;">
        <h3><i class="fas fa-clipboard-list"></i> Políticas del vendedor</h3>
        <div class="info-row">
          <div class="icon"><i class="fas fa-shipping-fast"></i></div>
          <div class="text">
            <label>Envíos</label>
            <span id="vendor-envios">—</span>
          </div>
        </div>
        <div class="info-row">
          <div class="icon"><i class="fas fa-shield-alt"></i></div>
          <div class="text">
            <label>Garantía</label>
            <span id="vendor-garantia">—</span>
          </div>
        </div>
        <div class="info-row">
          <div class="icon"><i class="fas fa-credit-card"></i></div>
          <div class="text">
            <label>Métodos de pago</label>
            <span id="vendor-pago">—</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- PRODUCTOS DEL VENDEDOR -->
    <main>
      <div class="section-title">
        <i class="fas fa-store"></i> Productos publicados
        <span class="count-badge" id="badge-count">...</span>
      </div>

      <div class="vendor-products-grid" id="vendor-products-grid">
        <!-- Skeletons de carga -->
        <div class="skeleton-card">
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton skeleton-line"></div>
          <div class="skeleton skeleton-line short"></div>
        </div>
      </div>
    </main>
  </div>

  <div id="contenedor-pie"></div>
  <script src="carrito.js"></script>
  <script src="cargar-componentes.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const idVendedor = params.get('id');
    let vendedorData = null;

    async function initVendedor() {
      if (!idVendedor) {
        document.querySelector('.vendor-layout').innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <i class="fas fa-user-slash"></i>
            <p>No se especificó ningún vendedor.</p>
          </div>`;
        return;
      }

      await cargarPerfilVendedor(idVendedor);
      cargarProductosVendedor(idVendedor);
    }

    initVendedor();

    function generarEstrellas(rating) {
      const r = Math.round(rating * 2) / 2;
      const llenas = Math.floor(r);
      const media = r % 1 !== 0;
      const vacias = 5 - llenas - (media ? 1 : 0);
      return '★'.repeat(llenas) + (media ? '⯨' : '') + '☆'.repeat(vacias);
    }

    async function cargarPerfilVendedor(id) {
      try {
        const resp = await fetch(`php/obtener_usuario.php?id=${id}`);
        const data = await resp.json();
        if (!data.exito) throw new Error(data.mensaje);

        vendedorData = data.usuario;
        const u = vendedorData;

        // Fotos
        if (u.foto_perfil) {
          document.getElementById('vendor-avatar').src = `fotos_perfil/${u.foto_perfil}`;
        }
        if (u.foto_portada) {
          document.getElementById('vendor-portada').src = `fotos_portada/${u.foto_portada}`;
          document.getElementById('vendor-portada').style.display = 'block';
        }

        // Nombre, verificación y fecha
        const isVerified = parseInt(u.verificado) === 1;
        document.getElementById('vendor-nombre').innerHTML = `
            ${u.nombre || 'Vendedor'}
            <span class="verification-badge ${isVerified ? '' : 'unverified'}">
                <i class="fas ${isVerified ? 'fa-check-circle' : 'fa-info-circle'}"></i>
                ${isVerified ? 'Verificado' : 'Vendedor no verificado'}
            </span>
        `;
        document.title = `${u.nombre} - MisCompras`;
        document.getElementById('vendor-fecha').innerHTML =
          `<i class="fas fa-calendar-alt"></i> Miembro desde ${u.fecha_registro || '—'}`;

        // Datos
        document.getElementById('vendor-ubicacion').textContent = u.ubicacion || 'No especificada';
        document.getElementById('vendor-email').textContent = u.email || '—';

        // Mini Mapa de Google Maps
        if (u.ubicacion) {
          const encodedUbicacion = encodeURIComponent(u.ubicacion);
          document.getElementById('vendor-mapa').src =
            `https://www.google.com/maps?q=${encodedUbicacion}&output=embed`;
          document.getElementById('vendor-mapa-link').href =
            `https://www.google.com/maps?q=${encodedUbicacion}`;
          document.getElementById('vendor-mapa-container').style.display = 'block';
        }

        // WhatsApp
        if (u.whatsapp) {
          const numero = u.whatsapp.replace(/\D/g, '');
          document.getElementById('btn-whatsapp').href =
            `https://wa.me/${numero}?text=Hola%2C%20vi%20tu%20perfil%20en%20MisCompras`;
          document.getElementById('panel-contacto').style.display = 'block';
        }

        // Info extra desde obtener_vendedor (rating, políticas)
        cargarInfoExtra(id);

      } catch (err) {
        console.error('Error cargando perfil:', err);
        document.getElementById('vendor-nombre').textContent = 'Vendedor no encontrado';
      }
    }

    async function cargarInfoExtra(id) {
      try {
        const resp = await fetch(`php/obtener_vendedor.php?id=${id}`);
        const data = await resp.json();
        if (!data.success) return;
        const v = data.vendedor;

        // Rating
        const rating = parseFloat(v.rating) || 0;
        document.getElementById('vendor-stars').textContent =
          rating > 0 ? generarEstrellas(rating) : 'Sin calificaciones';
        document.getElementById('vendor-rating-count').textContent =
          v.valoraciones > 0 ? `(${v.valoraciones} reseñas)` : '';

        // Políticas
        if (v.politica_envios || v.garantia || v.metodos_pago) {
          document.getElementById('vendor-envios').textContent = v.politica_envios || '—';
          document.getElementById('vendor-garantia').textContent = v.garantia || '—';
          document.getElementById('vendor-pago').textContent = v.metodos_pago || '—';
          document.getElementById('panel-politicas').style.display = 'block';
        }
      } catch (err) {
        console.warn('Sin datos extra del vendedor');
      }
    }

    async function cargarProductosVendedor(id) {
      const grid = document.getElementById('vendor-products-grid');
      try {
        const resp = await fetch(`php/mis_productos.php?id=${id}`);
        const data = await resp.json();

        grid.innerHTML = '';

        if (!data.exito || !data.productos || data.productos.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-box-open"></i>
              <p>Este vendedor aún no tiene productos publicados.</p>
            </div>`;
          document.getElementById('badge-count').textContent = '0';
          return;
        }

        const count = data.productos.length;
        document.getElementById('badge-count').textContent = count;
        document.getElementById('vendor-total-productos').textContent =
          `${count} producto${count !== 1 ? 's' : ''}`;

        data.productos.forEach(p => {
          const precioNumerico = parseFloat(p.precio);
          const precioFormateado = precioNumerico.toLocaleString('es-MX', {
            minimumFractionDigits: 0, maximumFractionDigits: 2
          });
          
          // Limpiar ruta de imagen si viene con 'imagenes/' desde el PHP
          const imgClean = p.imagen.replace('imagenes/', '');

          const card = document.createElement('div');
          card.className = 'vendor-product-card';
          card.innerHTML = `
            <a href="producto.html?id=${p.id_producto}">
                <img src="imagenes/${imgClean}" alt="${p.nombre}" 
                     onerror="this.onerror=null; this.src='imagendes de productos/${imgClean}'; this.onerror=()=>this.src='imagenes/placeholder.png'">
            </a>
            <div class="card-body">
              <a href="producto.html?id=${p.id_producto}" style="text-decoration:none; color:inherit;">
                <h4>${p.nombre}</h4>
              </a>
              <p class="price">$${precioFormateado}</p>
              ${parseInt(vendedorData?.verificado || 0) === 1 ? `
              <button class="btn-ver agregar-carrito" 
                       data-id="${p.id_producto}" 
                       data-nombre="${p.nombre}" 
                       data-precio="${p.precio}" 
                       data-imagen="imagenes/${imgClean}"
                       style="border:none; width:100%; cursor:pointer;">
                  <i class="fas fa-shopping-cart"></i> Agregar al carrito
              </button>
              ` : `
              <a href="https://wa.me/${vendedorData?.whatsapp ? vendedorData.whatsapp.replace(/\D/g, '') : ''}?text=${encodeURIComponent('Hola, me interesa el producto: ' + p.nombre)}" 
                 target="_blank"
                 class="btn-ver" 
                 style="background: #25d366; text-decoration: none; display: block; text-align: center;">
                  <i class="fab fa-whatsapp"></i> Pedir por WhatsApp
              </a>
              `}
            </div>
          `;
          grid.appendChild(card);
        });

      } catch (err) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-exclamation-circle"></i>
            <p>Error al cargar los productos.</p>
          </div>`;
      }
    }
  </script>
</body>

</html>
